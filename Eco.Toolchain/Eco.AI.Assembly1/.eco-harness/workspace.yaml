  CPP:
    prompt: prompts/languages/CPP.md
    skill_versions:
      acom_framework: '1'
    eco_wizard: CPP
  Python:
    prompt: prompts/languages/Python.md
    skill_versions:
      acom_framework: '1'
    eco_wizard: Python
  Java:
    prompt: prompts/languages/Java.md
    skill_versions:
      acom_framework: '1'
    eco_wizard: Java
models: {}
providers: {}
permissions:
  defaults:
    fs_read: true
    fs_write: true
    build: true
    execute: true
    rag_search: true
    skills: true
