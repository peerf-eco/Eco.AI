    model: coding_balanced
    reasoning: medium
  tester:
    backend: internal
    model: cheap_fast
    reasoning: low
  reviewer:
    backend: internal
    model: coding_balanced
    reasoning: high
languages:
  C:
    prompt: prompts/languages/C.md
    skill_versions:
      acom_framework: '1'
