# EcoOS local dev stack (api + frontend), bound to 127.0.0.1.
#
# PREREQUISITES on the host before `docker compose up`. The volumes below are
# bind-mounts of FILES/dirs — if a target is MISSING, Docker silently creates an
# empty DIRECTORY at the mount point and the app fails cryptically at runtime:
#   - .env                      (cp env.example .env; set OPENAI_API_KEY)
#   - marketplace_index.sqlite  (build: python scripts/build_marketplace_index.py)
#   - marketplace_cache/        (python scripts/fetch_marketplace.py)
# Binaries are bind-mounted straight into <repo>/bin/ — the canonical home
# resolve_binary probes after ECO_<NAME>_PATH (see
# agent/internal/tools/binaries.py). See docs/RAG_SETUP.md.
#
# This is a DEV compose: api = uvicorn --reload with ./agent + ./backend mounted;
# frontend = `npm run dev`. For prod, drop the eco_framework bind-mounts and dev commands.

services:
  # Backend API + Agent
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoos-api
    # Optional hardening: run as the host user so bind-mount writes match host
    # ownership (and git's safe.directory bypass becomes unnecessary). Set
    # UID/GID in .env to your host ids first — see README "Container setup".
    # Caveat: the image bakes /tmp/wine as root; as non-root wine re-inits it
    # under $HOME on first eco-cli call (one-time lag).
    # user: "${UID:-1000}:${GID:-1000}"
    # The full monorepo is bind-mounted at /app (see volumes), which shadows
    # the image's baked entrypoint.sh — disable it and run uvicorn directly.
    entrypoint: []
    # The harness code lives in the nested project dir, not at the repo root.
    working_dir: /app/Eco.Toolchain/Eco.AI.Assembly1
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Worktree creation runs `git` as root inside the container against the
      # host-owned repo; whitelist THE MOUNTED REPO PATH ONLY for git's
      # safe.directory ownership check (git >= 2.35.2 reads this env config).
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/app
      # Container-side worktree root. Fixed path unless overridden via .env
      # (ECO_WORKTREE_CONTAINER_ROOT — needed only for the identical-path
      # host-visibility recipe in README "Container setup"). Interpolated so
      # .env can override it: `environment:` beats `env_file:`.
      - ECO_WORKTREE_ROOT=${ECO_WORKTREE_CONTAINER_ROOT:-/repo-worktrees}
    volumes:
      # Full monorepo (the dir that contains .git) mounted as ONE unit at /app
      # so harness git operations — incl. `git worktree add` — resolve. Mount
      # the repo root, NOT `.git` alone: a lone .git has no working tree and
      # worktree creation fails. Relative path = portable across machines;
      # ../.. resolves next to this compose file (= the monorepo root).
      - ../..:/app:rw
      # Preserve prior per-artifact semantics on top of the monorepo mount:
      - ./marketplace_index.sqlite:/app/Eco.Toolchain/Eco.AI.Assembly1/marketplace_index.sqlite:rw
      - ./marketplace_cache:/app/Eco.Toolchain/Eco.AI.Assembly1/marketplace_cache:ro
      - ./eco_framework:/app/Eco.Toolchain/Eco.AI.Assembly1/eco_framework:ro
      # config was :ro in the pre-monorepo layout; keep it so: agent write
      # tools must not reach prompts/roles/permission baselines (the UI
      # settings pane writes .eco-harness/workspace.yaml, NOT config/).
      - ./config:/app/Eco.Toolchain/Eco.AI.Assembly1/config:ro
      # Host worktree-root bind so created worktrees persist on disk. Default
      # = <monorepo>.worktrees sibling dir (same default the harness uses on
      # the host). Override per machine via .env: ECO_WORKTREE_HOST_DIR=/abs/path
      - ${ECO_WORKTREE_HOST_DIR:-../../../Eco.AI.worktrees}:/repo-worktrees:rw
      # eco-cli / eco-wizard bind-mounted straight into <repo>/bin/ — the
      # canonical gitignored home resolve_binary probes (ECO_<NAME>_PATH →
      # <repo>/bin → PATH). The in-container mount shadows only the
      # container's view, so a host Windows eco-cli.exe next to it stays
      # untouched while the container runs the Linux build.
      # libaws-crt-jni.so must sit NEXT TO the eco-cli executable (JNI loads
      # it relative to the binary).
      - ../../../../Dist/eco-cli/eco-cli:/app/Eco.Toolchain/Eco.AI.Assembly1/bin/eco-cli:ro
      - ../../../../Dist/eco-cli/libaws-crt-jni.so:/app/Eco.Toolchain/Eco.AI.Assembly1/bin/libaws-crt-jni.so:ro
      # eco-wizard mount — same policy as eco-cli above.
      - ../../../../Dist/eco-wizard/eco-wizard:/app/Eco.Toolchain/Eco.AI.Assembly1/bin/eco-wizard:ro
    ports:
      - "127.0.0.1:8100:8000"
    command: ["uvicorn", "eco_harness.backend.server:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoos-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8100
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
       # Монтируем для разработки (кроме node_modules)
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # (ChromaDB init-rag utility removed 2026-06-22. Production RAG is the
  # shared marketplace_index.sqlite maintained by the import workflow.)
