# EcoOS local dev stack (api + frontend), bound to 127.0.0.1.
#
# PREREQUISITES on the host before `docker compose up`. The volumes below are
# bind-mounts of FILES/dirs — if a target is MISSING, Docker silently creates an
# empty DIRECTORY at the mount point and the app fails cryptically at runtime:
#   - .env                      (cp env.example .env; set OPENAI_API_KEY)
#   - marketplace_index.sqlite  (build: python scripts/build_marketplace_index.py)
#   - marketplace_cache/        (python scripts/fetch_marketplace.py)
# Binaries are bind-mounted straight into /opt (see resolve_binary in
# agent/internal/tools/binaries.py). See docs/RAG_SETUP.md.
#
# This is a DEV compose: api = uvicorn --reload with ./agent + ./backend mounted;
# frontend = `npm run dev`. For prod, drop the eco_framework bind-mounts and dev commands.

services:
  # Backend API + Agent
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoos-api
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./output:/app/output
      - ./traces:/app/traces
      - ./eco_framework:/app/eco_framework:ro
      # Marketplace RAG (production, 2026-05-24):
      #   marketplace_index.sqlite — sqlite-vec + FTS5 index, updated by UI imports
      #     from 175 .h files across 30 components, embedded with
      #     qwen3-embedding-8b (4096-dim). The UI can update this shared file;
      #     via scripts/build_marketplace_index.py.
      #   marketplace_cache — pre-pulled DEVKITs (headers + .lib/.so) the
      #     agent can read directly without another eco-cli pull. Same
      #     content the RAG was built from, kept in sync.
      - ./marketplace_index.sqlite:/app/marketplace_index.sqlite
      - ./marketplace_cache:/app/marketplace_cache
      # eco-cli / eco-wizard are bind-mounted straight to the ELF files
      # (paths resolved by agent/internal/tools/binaries.py):
      #   ECO_CLI_PATH / ECO_WIZARD_PATH in .env override these mounts.
      - ../../../../Dist/eco-cli/eco-cli:/opt/eco-cli:ro
      - ../../../../Dist/eco-cli/libaws-crt-jni.so:/opt/libaws-crt-jni.so:ro
      # eco-wizard mount — same policy as eco-cli above.
      - ../../../../Dist/eco-wizard/eco-wizard:/opt/eco-wizard:ro
      # Монтируем код для разработки (hot reload)
      - ./agent:/app/agent
      - ./backend:/app/backend
      - ./eco_harness:/app/eco_harness
      - ./scripts:/app/scripts
      - ./config:/app/config:ro
      - ./.eco-harness:/app/.eco-harness
    ports:
      - "127.0.0.1:8100:8000"
    command: ["uvicorn", "backend.server:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoos-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8100
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
       # Монтируем для разработки (кроме node_modules)
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # (ChromaDB init-rag utility removed 2026-06-22. Production RAG is the
  # shared marketplace_index.sqlite maintained by the import workflow.)
