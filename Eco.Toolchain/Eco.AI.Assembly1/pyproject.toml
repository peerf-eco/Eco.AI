[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-harness"
version = "1.0.0"
description = "ACOM meta-harness: bounded role orchestration over EcoOS marketplace tooling"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
]

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
]
rag = [
    "sqlite-vec>=0.1.6",
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-c==0.21.4",
    "httpx>=0.27",
]
# Full runtime dependency set (mirrors agent/requirements.txt).
all = [
    "eco-harness[server,rag]",
]

[project.scripts]
eco-harness = "eco_harness.interfaces.cli:main"

[tool.setuptools]
packages = [
    "agent",
    "agent.config",
    "agent.context",
    "agent.internal",
    "agent.internal.agents",
    "agent.internal.tools",
    "agent.pi_ai",
    "agent.pi_ai.providers",
    "agent.pi_ai.utils",
    "agent.rag",
    "backend",
    "eco_harness",
    "eco_harness.adapters",
    "eco_harness.extensions",
    "eco_harness.interfaces",
    "eco_harness.tools",
]
