# Eco.AI Harness — customer Docker install (reference copy).
#
# The installers (scripts/install/install.{sh,ps1} --docker) GENERATE this
# file with absolute host paths baked in; this checked-in version is the
# reference for manual installs. Update flow:
#   docker compose pull && docker compose up -d
#
# Prereqs: host ecosystem root $ECO_HOME (default ~/ecoos; contains the
# toolchain, app home, framework, and workspace) and a project dir (the folder
# the UI will work in).

services:
  eco-harness:
    image: ${ECO_HARNESS_IMAGE:-ghcr.io/peerf-eco/eco.ai}:${ECO_HARNESS_TAG:-latest}
    container_name: eco-harness
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ECO_HOME: /data
      ECO_TOOLCHAIN: /data/toolchain
      ECO_HARNESS: /data/toolchain/eco-harness
      ECO_PROJECT_DIR: /project
      ECO_WORKTREE_ROOT: /data/worktrees
      # Worktree creation runs git against the host-owned mounted project;
      # whitelist THE MOUNTED PROJECT PATH ONLY (git >= 2.35.2).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /project
    env_file:
      - ${ECO_HARNESS:-${ECO_HOME:-$HOME/ecoos}/toolchain/eco-harness}/.env
    volumes:
      # Ecosystem root: toolchain/eco-cli + eco-wizard, app home, framework,
      # and any other Eco platform data persist together on the host.
      - ${ECO_HOME:-$HOME/ecoos}:/data
      # Explicit nested mounts keep custom ECO_TOOLCHAIN/ECO_HARNESS values
      # usable while preserving the same container-side standard paths.
      - ${ECO_TOOLCHAIN:-${ECO_HOME:-$HOME/ecoos}/toolchain}:/data/toolchain
      - ${ECO_HARNESS:-${ECO_TOOLCHAIN:-${ECO_HOME:-$HOME/ecoos}/toolchain}/eco-harness}:/data/toolchain/eco-harness
      # The user project (UI folder picker starts here). Standard default:
      # <ECO_PROJECTS_DIR>/default (ECO_PROJECTS_DIR → $ECO_HOME/workspace);
      # ECO_PROJECT_DIR still wins when the install flow pre-set it.
      - ${ECO_PROJECT_DIR:-${ECO_PROJECTS_DIR:-${ECO_HOME:-$HOME/ecoos}/workspace}/default}:/project
    restart: unless-stopped
